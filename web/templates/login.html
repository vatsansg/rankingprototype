{% extends "base.html" %}
{% block title %}Log In — WTT Ranking Engine{% endblock %}
{% block content %}
<div class="card" style="max-width:360px; margin:60px auto;">
  <h1>Log In</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required autofocus style="max-width:100%;">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required style="max-width:100%;">
    <button type="submit">Log In</button>
  </form>
</div>
{% endblock %}
