{% extends "base.html" %}
{% block title %}My Password — WTT Ranking Engine{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h1>Change My Password</h1>
  {% if success %}<div class="success">Password updated.</div>{% endif %}
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post">
    <label for="current_password">Current Password</label>
    <input type="password" id="current_password" name="current_password" required style="max-width:100%;">
    <label for="new_password">New Password</label>
    <input type="password" id="new_password" name="new_password" required style="max-width:100%;">
    <label for="confirm_password">Confirm New Password</label>
    <input type="password" id="confirm_password" name="confirm_password" required style="max-width:100%;">
    <p class="muted">At least 8 characters, with at least one letter and one digit.</p>
    <button type="submit">Update Password</button>
  </form>
</div>
{% endblock %}
