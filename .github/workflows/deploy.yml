name: deploy

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC federated login -- no Azure secret stored in GitHub
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC federated credential)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Zip application for deployment
        run: |
          zip -r ../app.zip . -x '.git/*' -x '.github/*' -x '.pytest_cache/*' -x '**/__pycache__/*'

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ../app.zip

      - name: Azure logout
        if: always()
        run: az logout
